<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Omnitrix Mission Selector — rotate the dial to choose your fitness mission!">
    <title>Omnitrix Mission Selector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background effects -->
    <div class="bg-grid"></div>
    <div class="bg-ring bg-ring-1"></div>
    <div class="bg-ring bg-ring-2"></div>
    <div class="particles" id="particles"></div>

    <!-- Activation flash overlay -->
    <div class="activation-flash" id="activation-flash"></div>

    <div class="app-wrapper">

        <!-- Title -->
        <header class="app-header">
            <div class="header-line left"></div>
            <div class="header-center">
                <svg viewBox="0 0 60 60" class="header-icon" width="28" height="28">
                    <polygon points="30,6 46,26 46,34 30,54 14,34 14,26" fill="none" stroke="#39ff14" stroke-width="2" stroke-linejoin="round"/>
                    <circle cx="30" cy="30" r="4" fill="#39ff14" opacity="0.8"/>
                </svg>
                <h1>OMNITRIX MISSIONS</h1>
            </div>
            <div class="header-line right"></div>
        </header>

        <!-- Main Omnitrix Watch -->
        <div class="omnitrix-watch" id="omnitrix-watch">

            <!-- Outer metallic bezel -->
            <div class="bezel">
                <div class="bezel-tick" style="--angle:0deg"></div>
                <div class="bezel-tick" style="--angle:30deg"></div>
                <div class="bezel-tick" style="--angle:60deg"></div>
                <div class="bezel-tick" style="--angle:90deg"></div>
                <div class="bezel-tick" style="--angle:120deg"></div>
                <div class="bezel-tick" style="--angle:150deg"></div>
                <div class="bezel-tick" style="--angle:180deg"></div>
                <div class="bezel-tick" style="--angle:210deg"></div>
                <div class="bezel-tick" style="--angle:240deg"></div>
                <div class="bezel-tick" style="--angle:270deg"></div>
                <div class="bezel-tick" style="--angle:300deg"></div>
                <div class="bezel-tick" style="--angle:330deg"></div>
            </div>

            <!-- Rotate arrows -->
            <button class="rotate-btn rotate-left" id="rotate-left" title="Previous mission">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <polyline points="15,4 7,12 15,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="rotate-btn rotate-right" id="rotate-right" title="Next mission">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <polyline points="9,4 17,12 9,20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- Dial face -->
            <div class="dial-face">

                <!-- Rotating icons ring -->
                <div class="dial-ring" id="dial-ring">
                    <!-- Mission icons are injected by JS -->
                </div>

                <!-- Center display -->
                <div class="center-core" id="center-core">
                    <div class="core-icon" id="core-icon">
                        <!-- Current mission icon -->
                    </div>
                    <div class="core-name" id="core-name">NO MISSION</div>
                    <div class="core-status" id="core-status">ROTATE TO SELECT</div>
                </div>

                <!-- Omnitrix hourglass overlay -->
                <svg class="hourglass-overlay" viewBox="0 0 300 300">
                    <polygon points="150,30 220,130 220,170 150,270 80,170 80,130"
                        fill="none" stroke="#39ff1418" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>

            <!-- Selector indicator (top) -->
            <div class="selector-indicator">
                <svg viewBox="0 0 30 20" width="30" height="20">
                    <polygon points="15,18 3,3 27,3" fill="#39ff14" opacity="0.8"/>
                </svg>
            </div>
        </div>

        <!-- Mission action button -->
        <button class="action-btn" id="action-btn">
            <span class="action-text">ACTIVATE MISSION</span>
            <div class="action-glow"></div>
        </button>

        <!-- Mission status bar -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">TOTAL</span>
                <span class="status-value" id="total-count">0</span>
            </div>
            <div class="status-divider"></div>
            <div class="status-item">
                <span class="status-label">ACTIVE</span>
                <span class="status-value" id="active-count">0</span>
            </div>
            <div class="status-divider"></div>
            <div class="status-item">
                <span class="status-label">COMPLETE</span>
                <span class="status-value" id="done-count">0</span>
            </div>
        </div>

        <!-- Mission list panel -->
        <div class="mission-panel">
            <div class="panel-header">
                <h2>MISSION LOG</h2>
                <button class="add-mission-btn" id="add-mission-btn" title="Add custom mission">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                    ADD MISSION
                </button>
            </div>

            <!-- Add mission form (hidden by default) -->
            <div class="add-form" id="add-form">
                <input type="text" id="mission-input" placeholder="Enter mission name..." maxlength="30" autocomplete="off">
                <div class="form-actions">
                    <select id="mission-icon-select">
                        <option value="🏃">🏃 Running</option>
                        <option value="💪">💪 Pushup</option>
                        <option value="🦵">🦵 Squat</option>
                        <option value="🧘">🧘 Plank</option>
                        <option value="⭐">⭐ Jumping Jacks</option>
                        <option value="🏋️">🏋️ Weight Lift</option>
                        <option value="🚴">🚴 Cycling</option>
                        <option value="🏊">🏊 Swimming</option>
                        <option value="🥊">🥊 Boxing</option>
                        <option value="🧗">🧗 Climbing</option>
                        <option value="🎯">🎯 Custom</option>
                    </select>
                    <button class="confirm-btn" id="confirm-add">ADD</button>
                    <button class="cancel-btn" id="cancel-add">✕</button>
                </div>
            </div>

            <!-- Mission list -->
            <ul class="mission-list" id="mission-list">
                <!-- Rendered by JS -->
            </ul>

            <div class="empty-log" id="empty-log">
                <p>No missions in log</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
